apiVersion: apps/v1
kind: Deployment
metadata:
  name: kolibri-ai
  namespace: kolibri-ai
  labels:
    app: kolibri-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kolibri-ai
  template:
    metadata:
      labels:
        app: kolibri-ai
    spec:
      containers:
      - name: kolibri-ai
        image: kolibri-ai:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: ALIBABA_API_KEY
          valueFrom:
            secretKeyRef:
              name: kolibri-ai-secret
              key: alibaba-api-key
        - name: DATABASE_URL
          value: postgresql://kolibri_ai:KolibriAI2024Secure!@postgres-ai-service:5432/kolibri_ai
        - name: AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kolibri-ai-secret
              key: auth-password
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kolibri-ai-service
  namespace: kolibri-ai
spec:
  selector:
    app: kolibri-ai
  ports:
  - port: 80
    targetPort: 8000
    name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kolibri-ai-ingress
  namespace: kolibri-ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - ai.angelsforedu.org
    secretName: kolibri-ai-tls
  rules:
  - host: ai.angelsforedu.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kolibri-ai-service
            port:
              number: 80
---
apiVersion: v1
kind: Secret
metadata:
  name: kolibri-ai-secret
  namespace: kolibri-ai
type: Opaque
stringData:
  alibaba-api-key: "sk-ws-H.HRPEHI.bXmQ.MEYCIQDqkvzLHf7-M51gFuRuT5AC69mJ6NKqHAZ9nBIVOsLQ2AIhALBcnE7A913rdLCKIXCAMvvy72EVNlgMcNrKLzu0anHY"
