<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angels Academy AI</title>
<style>
@font-face { font-family: 'Open Sans'; src: url('/static/assets/open-sans-latin.woff2') format('woff2'); font-weight: 300 700; font-display: swap; }
@font-face { font-family: 'Open Sans'; src: url('/static/assets/open-sans-latin-ext.woff2') format('woff2'); font-weight: 300 700; font-display: swap; unicode-range: U+0100-024F; }

:root {
  --primary: #213953; --primary-dark: #1a2e43; --secondary: #a6c52e; --secondary-dark: #859e25;
  --bg: #f5f7fa; --surface: #ffffff; --text: #1a1a1a; --text-secondary: #666;
  --border: #e0e0e0; --chat-user: #e8eef5; --chat-ai: #f0f4e8;
  --sidebar-bg: #213953; --sidebar-text: #e0e0e0;
}
[data-theme="dark"] {
  --bg: #0c131b; --surface: #1a2e43; --text: #e0e0e0; --text-secondary: #8899aa;
  --border: #3a5570; --chat-user: #253547; --chat-ai: #1e3550;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Open Sans', 'Noto Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

/* Login */
#login-page { display: flex; align-items: center; justify-content: center; height: 100vh;
  background: linear-gradient(135deg, #1a2e43, #213953, #0c131b); }
.login-box { background: var(--surface); border-radius: 16px; padding: 40px; text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3); max-width: 380px; width: 90%; }
.login-box img { height: 50px; margin-bottom: 20px; }
.login-box h2 { color: var(--secondary); font-size: 18px; margin-bottom: 8px; }
.login-box p { color: var(--text-secondary); font-size: 13px; margin-bottom: 24px; }
.login-box input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 15px; background: var(--bg); color: var(--text); margin-bottom: 16px; }
.login-box button { width: 100%; padding: 12px; background: var(--secondary); color: #1a1a1a;
  border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
.login-box button:hover { background: var(--secondary-dark); }
.login-error { color: #e74c3c; font-size: 13px; margin-bottom: 12px; display: none; }

/* Main layout */
#app { display: none; height: 100vh; }
.layout { display: flex; height: 100%; }

/* Sidebar */
.sidebar { width: 280px; background: var(--sidebar-bg); color: var(--sidebar-text); display: flex;
  flex-direction: column; flex-shrink: 0; border-right: 1px solid var(--border); }
.sidebar-header { padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex;
  align-items: center; gap: 12px; }
.sidebar-header img { height: 32px; }
.sidebar-header span { font-weight: 600; font-size: 14px; }
.sidebar-actions { padding: 12px; }
.btn-new { width: 100%; padding: 10px; background: var(--secondary); color: #1a1a1a; border: none;
  border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex;
  align-items: center; justify-content: center; gap: 6px; }
.btn-new:hover { background: var(--secondary-dark); }
.conv-list { flex: 1; overflow-y: auto; padding: 8px; }
.conv-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
  margin-bottom: 4px; color: var(--sidebar-text); display: flex; align-items: center; gap: 4px; }
.conv-item span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-item:hover { background: rgba(255,255,255,0.1); }
.conv-item.active { background: var(--secondary); color: #1a1a1a; }
.conv-item .delete-btn { opacity: 0; background: none; border: none; color: inherit; cursor: pointer;
  font-size: 16px; padding: 0 4px; flex-shrink: 0; }
.conv-item:hover .delete-btn { opacity: 0.6; }
.conv-item .delete-btn:hover { opacity: 1; }
.sidebar-footer { padding: 12px; border-top: 1px solid rgba(255,255,255,0.1); display: flex;
  justify-content: space-between; align-items: center; font-size: 12px; }
.sidebar-footer button { background: none; border: none; color: var(--sidebar-text); cursor: pointer;
  font-size: 12px; padding: 4px 8px; border-radius: 4px; }
.sidebar-footer button:hover { background: rgba(255,255,255,0.1); }

/* Main chat area */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.main-header { padding: 23px 20px; background: var(--surface);
  display: flex; align-items: center; min-height: 32px; font-weight: 600; font-size: 14px;
  color: var(--text-secondary); }
.topbar { padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--surface);
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.topbar .model-info { font-size: 12px; color: var(--text-secondary); margin-left: auto; }
.theme-toggle { background: none; border: 1px solid var(--border); border-radius: 50%;
  width: 32px; height: 32px; cursor: pointer; font-size: 16px; color: var(--text);
  display: flex; align-items: center; justify-content: center; margin-left: auto; }

/* Messages */
.messages { flex: 1; overflow-y: auto; padding: 20px; }
.message { max-width: 800px; margin: 0 auto 16px; padding: 14px 18px; border-radius: 12px;
  font-size: 14px; line-height: 1.6; position: relative; }
.message.user { background: var(--chat-user); margin-left: 60px; }
.message.assistant { background: var(--chat-ai); margin-right: 60px; }
.message .role { font-size: 11px; font-weight: 700; color: var(--text-secondary); margin-bottom: 4px;
  text-transform: uppercase; }
.message .meta { font-size: 11px; color: var(--text-secondary); margin-top: 8px; }
.message .content { word-wrap: break-word; }
.message .content p { margin-bottom: 8px; }
.message .content ul, .message .content ol { margin: 8px 0; padding-left: 20px; }
.message .content code { background: rgba(0,0,0,0.1); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
.message .content pre { background: rgba(0,0,0,0.15); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
.message .content pre code { background: none; padding: 0; }
.rag-toggle { font-size: 12px; color: var(--secondary); cursor: pointer; margin-top: 6px;
  background: none; border: none; font-family: inherit; }
.rag-sources { display: none; margin-top: 8px; padding: 10px; background: rgba(0,0,0,0.08);
  border-radius: 8px; font-size: 12px; line-height: 1.5; }
.rag-sources.show { display: block; }
.rag-source { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.rag-source:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.rag-source .src-label { font-weight: 600; color: var(--secondary-dark); }

.welcome { text-align: center; padding: 60px 20px; }
.welcome img { height: 60px; margin-bottom: 16px; }
.welcome h2 { color: var(--secondary); margin-bottom: 8px; font-size: 22px; }
.welcome p { color: var(--text-secondary); max-width: 500px; margin: 0 auto; font-size: 14px; }

.typing { display: none; max-width: 800px; margin: 0 auto 16px; padding: 14px 18px;
  background: var(--chat-ai); border-radius: 12px; margin-right: 60px; }
.typing.show { display: block; }
.typing-dots { display: flex; gap: 4px; }
.typing-dots span { width: 8px; height: 8px; background: var(--text-secondary); border-radius: 50%;
  animation: bounce 1.4s infinite ease-in-out; }
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,80%,100% { transform: scale(0); } 40% { transform: scale(1); } }

/* Input area */
.input-area { padding: 16px 20px; border-top: 1px solid var(--border); background: var(--surface); }
.input-row { max-width: 800px; margin: 0 auto; display: flex; gap: 10px; }
.input-row textarea { flex: 1; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px;
  background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit; resize: none;
  min-height: 48px; max-height: 120px; }
.input-row textarea:focus { outline: none; border-color: var(--secondary); }
.input-row button { padding: 12px 20px; background: var(--secondary); color: #1a1a1a; border: none;
  border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.input-row button:hover { background: var(--secondary-dark); }
.input-row button:disabled { opacity: 0.5; cursor: not-allowed; }

/* Responsive */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .message { margin-left: 8px !important; margin-right: 8px !important; }
}
.message .content h1, .message .content h2, .message .content h3,
.message .content h4, .message .content h5, .message .content h6 {
  margin: 12px 0 6px; font-weight: 700; line-height: 1.3; }
.message .content h1 { font-size: 18px; } .message .content h2 { font-size: 16px; }
.message .content h3 { font-size: 15px; } .message .content h4 { font-size: 14px; }
.message .content blockquote { border-left: 3px solid var(--secondary); margin: 8px 0;
  padding: 4px 12px; color: var(--text-secondary); font-style: italic; }
.message .content table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
.message .content th, .message .content td { border: 1px solid var(--border);
  padding: 6px 10px; text-align: left; }
.message .content th { background: rgba(0,0,0,0.1); font-weight: 600; }
.message .content hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
.message .content > *:first-child { margin-top: 0; }
.message .content > *:last-child { margin-bottom: 0; }
</style>
<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="login-page">
  <div class="login-box">
    <img src="/static/assets/logo-academy-horizontal-green.svg" alt="Angels Academy">
    <h2>AI Teaching Assistant</h2>
    <p>Enter the access password to continue</p>
    <div class="login-error" id="login-error">Incorrect password</div>
    <input type="password" id="login-password" placeholder="Password" autofocus>
    <button onclick="doLogin()">Enter</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <img src="/static/assets/logo-icon-green.png" alt="">
        <span>Angels Academy AI</span>
      </div>
      <div class="sidebar-actions">
        <button class="btn-new" onclick="newConversation()">+ New Conversation</button>
      </div>
      <div class="conv-list" id="conv-list"></div>
      <div class="sidebar-footer">
        <button onclick="exportData()">📥 Export</button>
        <button onclick="doLogout()">🚪 Logout</button>
      </div>
    </div>

    <!-- Main -->
    <div class="main">
      <div class="main-header">Angels Academy AI</div>
      <div class="topbar">
        <div class="model-info" id="model-info">🤖 Qwen3.7-max</div>
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌓</button>
      </div>

      <div class="messages" id="messages">
        <div class="welcome">
          <img src="/static/assets/logo-icon-green.png" alt="">
          <h2>Angels Academy Assistant</h2>
          <p>I'm here to help you with English language, lesson preparation, and Bible study questions. How can I assist you today?</p>
        </div>
      </div>

      <div class="typing" id="typing">
        <div class="typing-dots"><span></span><span></span><span></span></div>
      </div>

      <div class="input-area">
        <div class="input-row">
          <textarea id="user-input" placeholder="Type your message..." rows="1"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"
            oninput="autoResize(this)"></textarea>
          <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let currentConvId = null;
let sending = false;

// --- Auth (token-based for iframe compatibility) ---
function authFetch(url, options = {}) {
  const token = localStorage.getItem('angels_ai_token');
  if (token) {
    options.headers = { ...(options.headers || {}), 'Authorization': `Bearer ${token}` };
  }
  return fetch(url, options);
}

async function checkAuth() {
  const token = localStorage.getItem('angels_ai_token');
  if (token) {
    try {
      const r = await authFetch('/api/auth/check');
      const d = await r.json();
      if (d.authenticated) { showApp(); return; }
    } catch(e) {}
    localStorage.removeItem('angels_ai_token');
  }
  document.getElementById('login-page').style.display = 'flex';
}

async function doLogin() {
  const pw = document.getElementById('login-password').value;
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({password: pw})
    });
    if (r.ok) {
      const d = await r.json();
      localStorage.setItem('angels_ai_token', d.token);
      showApp();
    }
    else { document.getElementById('login-error').style.display = 'block'; }
  } catch(e) { document.getElementById('login-error').style.display = 'block'; }
}

async function doLogout() {
  localStorage.removeItem('angels_ai_token');
  await authFetch('/api/logout', {method:'POST'});
  location.reload();
}

document.getElementById('login-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

// --- App init ---
async function showApp() {
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  await loadConversations();
}

// --- Conversations ---
async function loadConversations() {
  const r = await authFetch('/api/conversations');
  const d = await r.json();
  const list = document.getElementById('conv-list');
  list.innerHTML = '';
  for (const c of d.conversations) {
    const div = document.createElement('div');
    div.className = 'conv-item' + (c.id === currentConvId ? ' active' : '');
    div.innerHTML = `<span>${escHtml(c.title)}</span><button class="delete-btn" onclick="event.stopPropagation();deleteConv('${c.id}')" title="Delete">×</button>`;
    div.onclick = () => loadConversation(c.id);
    list.appendChild(div);
  }
}

async function loadConversation(convId) {
  currentConvId = convId;
  const r = await authFetch(`/api/conversations/${convId}`);
  const d = await r.json();
  const msgs = document.getElementById('messages');
  msgs.innerHTML = '';
  for (const m of d.messages) {
    appendMessage(m.role, m.content, m.rag_sources, m.created_at);
  }
  msgs.scrollTop = msgs.scrollHeight;
  await loadConversations();
}

function newConversation() {
  currentConvId = null;
  const msgs = document.getElementById('messages');
  msgs.innerHTML = `<div class="welcome"><img src="/static/assets/logo-icon-green.png" alt=""><h2>Angels Academy Assistant</h2><p>I'm here to help you with English language, lesson preparation, and Bible study questions. How can I assist you today?</p></div>`;
}

async function deleteConv(convId) {
  if (!confirm('Delete this conversation?')) return;
  await authFetch(`/api/conversations/${convId}`, {method:'DELETE'});
  if (currentConvId === convId) newConversation();
  await loadConversations();
}

// --- Chat ---
async function sendMessage() {
  if (sending) return;
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;

  sending = true;
  document.getElementById('send-btn').disabled = true;
  input.value = '';
  autoResize(input);

  // Clear welcome if first message
  if (!currentConvId) {
    document.getElementById('messages').innerHTML = '';
  }

  appendMessage('user', text);
  document.getElementById('typing').classList.add('show');
  scrollToBottom();

  try {
    const r = await authFetch('/api/chat', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        message: text,
        conversation_id: currentConvId,
      })
    });
    const d = await r.json();
    currentConvId = d.conversation_id;

    document.getElementById('typing').classList.remove('show');
    appendMessage('assistant', d.message, JSON.stringify(d.rag_sources || []), null, d.elapsed_seconds);
    await loadConversations();
  } catch(e) {
    document.getElementById('typing').classList.remove('show');
    appendMessage('assistant', `[Error: ${e.message}]`);
  }

  sending = false;
  document.getElementById('send-btn').disabled = false;
  scrollToBottom();
}

function appendMessage(role, content, ragJson, timestamp, elapsed) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `message ${role}`;

  let meta = '';
  if (role === 'assistant' && elapsed) {
    meta = `<div class="meta">${elapsed}s</div>`;
  }

  let ragHtml = '';
  if (role === 'assistant' && ragJson) {
    try {
      const sources = typeof ragJson === 'string' ? JSON.parse(ragJson) : ragJson;
      if (sources && sources.length > 0) {
        let srcItems = sources.map((s, i) =>
          `<div class="rag-source"><span class="src-label">${escHtml(s.source)}</span> (score: ${s.score})<br>${escHtml(s.text?.substring(0, 200))}...</div>`
        ).join('');
        ragHtml = `<button class="rag-toggle" onclick="this.nextElementSibling.classList.toggle('show')">📚 ${sources.length} source(s) used</button><div class="rag-sources">${srcItems}</div>`;
      }
    } catch(e) {}
  }

  div.innerHTML = `<div class="role">${role === 'user' ? '👤 You' : '🤖 Assistant'}</div><div class="content">${formatContent(content)}</div>${meta}${ragHtml}`;
  msgs.appendChild(div);
}

function formatContent(text) {
  if (!text) return '';
  if (typeof marked !== 'undefined') {
    return marked.parse(text, { breaks: true, gfm: true });
  }
  // Fallback if marked.js hasn't loaded
  let html = escHtml(text);
  html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  return html;
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function scrollToBottom() {
  const msgs = document.getElementById('messages');
  setTimeout(() => msgs.scrollTop = msgs.scrollHeight, 50);
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// --- Theme ---
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
  localStorage.setItem('angels-ai-theme', html.getAttribute('data-theme'));
}

// Restore theme
const saved = localStorage.getItem('angels-ai-theme');
if (saved) document.documentElement.setAttribute('data-theme', saved);

// --- Export ---
async function exportData() {
  const r = await authFetch('/api/export');
  const blob = await r.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'angels_ai_export.json'; a.click();
  URL.revokeObjectURL(url);
}

// --- Init ---
checkAuth();
</script>
</body>
</html>
